name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: Build (MSVC, windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y

      - name: Configure CMake (Ninja)
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Verify artifact
        shell: pwsh
        run: |
          if (-not (Test-Path build/audio_output_monitor.exe)) { throw "exe not produced" }
          Get-Item build/audio_output_monitor.exe | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio_output_monitor
          path: build/audio_output_monitor.exe
          if-no-files-found: error
